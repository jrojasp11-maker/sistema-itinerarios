services:

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       itinerarios_db
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d itinerarios_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  airport-service:
    build:
      context: .
      dockerfile: airport_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      API_COLOMBIA_URL: https://api-colombia.com/api/v1

  itinerary-service:
    build:
      context: .
      dockerfile: itinerary_service/Dockerfile
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
      airport-service:
        condition: service_started
    environment:
      DATABASE_URL:        postgresql+asyncpg://admin:secret@db:5432/itinerarios_db
      AIRPORT_SERVICE_URL: http://airport-service:8001

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - airport-service
      - itinerary-service

volumes:
  pgdata:
